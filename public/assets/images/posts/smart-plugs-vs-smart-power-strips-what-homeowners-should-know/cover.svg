      <circle cx="29" cy="29" r="15" fill="#eef4ee" stroke="#5f7b52" stroke-width="4"/>
      <path d="M21 29 L28 36 L40 22" fill="none" stroke="#5f7b52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
