    <text x="84" y="130" fill="#5d7472" font-size="22">Compare control, scheduling, energy monitoring, and load-rating questions before buying.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="76" y="176" width="486" height="266" rx="24" fill="url(#panelA)" stroke="#a9beb9" stroke-width="3"/>
