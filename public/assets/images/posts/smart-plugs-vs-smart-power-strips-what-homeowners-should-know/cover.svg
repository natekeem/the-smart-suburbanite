<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Smart plug and smart power strip comparison cover</title>
  <desc id="desc">A calm homeowner comparison board showing a smart plug and a smart power strip with checklist cards for load rating, app, Wi-Fi, schedule, energy, and safety considerations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbf8"/>
      <stop offset="0.52" stop-color="#eef5f1"/>
      <stop offset="1" stop-color="#dde9ec"/>
    </linearGradient>
    <linearGradient id="panelA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf6f2"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f2ebd8"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e5eef6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#183c3e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 496 C151 456 292 465 444 501 C607 540 766 527 930 490 C1046 464 1135 465 1200 480 L1200 630 L0 630 Z" fill="#c6dcd7" opacity="0.72"/>
  <path d="M0 536 C190 504 358 519 523 544 C700 570 846 543 1022 516 C1085 507 1144 506 1200 516 L1200 630 L0 630 Z" fill="#b7cecc" opacity="0.5"/>

  <g font-family="Arial, Helvetica, sans-serif">
