      <circle cx="29" cy="29" r="15" fill="#f2e9f3" stroke="#76547d" stroke-width="4"/>
      <path d="M21 29 L28 36 L40 22" fill="none" stroke="#76547d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="38" fill="#4d3654">Energy</text>
