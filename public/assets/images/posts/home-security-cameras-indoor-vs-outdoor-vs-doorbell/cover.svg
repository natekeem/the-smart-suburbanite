<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Indoor outdoor and doorbell camera comparison cover</title>
  <desc id="desc">A calm homeowner comparison board with abstract indoor, outdoor, and doorbell panels plus checklist cards for privacy, Wi-Fi, storage, power, and app considerations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf7"/>
      <stop offset="0.52" stop-color="#edf5f0"/>
      <stop offset="1" stop-color="#dae7eb"/>
    </linearGradient>
    <linearGradient id="panelA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6f2"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f3ecd9"/>
    </linearGradient>
    <linearGradient id="panelC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#e6eef5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#173b3d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 487 C140 455 286 464 431 499 C592 537 752 528 921 489 C1039 462 1128 463 1200 477 L1200 630 L0 630 Z" fill="#c7dcd7" opacity="0.72"/>
  <path d="M0 532 C190 500 353 517 517 542 C698 570 845 543 1020 515 C1087 504 1145 504 1200 514 L1200 630 L0 630 Z" fill="#b9d0ce" opacity="0.55"/>

  <g font-family="Arial, Helvetica, sans-serif">
