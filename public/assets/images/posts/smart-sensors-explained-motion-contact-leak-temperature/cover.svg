      <stop offset="0" stop-color="#748a7a"/>
      <stop offset="1" stop-color="#5f7568"/>
    </linearGradient>
    <radialGradient id="light" cx="0.18" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#fff9e8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff9e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
