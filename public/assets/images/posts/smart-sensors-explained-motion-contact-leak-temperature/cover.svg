<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Calm laundry and utility area with a subtle sensor-like object</title>
  <desc id="desc">A softly lit laundry and utility corner with cabinetry, a washer, baskets, folded linens, and a small unbranded sensor-like object near the floor.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf0e8"/>
      <stop offset="1" stop-color="#dce3d9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb99d"/>
      <stop offset="1" stop-color="#a98f6d"/>
