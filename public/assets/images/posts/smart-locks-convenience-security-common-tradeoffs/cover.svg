<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Smart lock tradeoffs front entryway cover</title>
  <desc id="desc">A calm front entryway with a house key, keypad access cue, guest code note, backup key tag, and battery reminder showing smart lock tradeoffs.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6faf6"/>
      <stop offset="0.52" stop-color="#eef5f1"/>
      <stop offset="1" stop-color="#dde8e9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7c6aa"/>
      <stop offset="1" stop-color="#bba88a"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf4"/>
      <stop offset="1" stop-color="#e5ded0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeff1"/>
      <stop offset="1" stop-color="#bdd4d7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2c4647" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2c4647" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#wall)"/>
  <path d="M0 446 H1200 V630 H0 Z" fill="url(#floor)"/>
  <path d="M0 446 C170 425 304 430 445 451 C610 476 780 468 954 437 C1045 421 1132 421 1200 438 V630 H0 Z" fill="#c6d8d2" opacity="0.36"/>

  <g filter="url(#softShadow)">
    <rect x="406" y="74" width="388" height="452" rx="18" fill="#f8f6ef" stroke="#aebeb8" stroke-width="5"/>
    <rect x="438" y="112" width="324" height="384" rx="12" fill="url(#door)" stroke="#c3b79f" stroke-width="4"/>
    <rect x="462" y="138" width="126" height="160" rx="10" fill="url(#glass)" stroke="#b1c6c7" stroke-width="4"/>
    <rect x="612" y="138" width="126" height="160" rx="10" fill="url(#glass)" stroke="#b1c6c7" stroke-width="4"/>
    <rect x="462" y="326" width="276" height="142" rx="10" fill="#eee8da" stroke="#c4b99f" stroke-width="4"/>
    <circle cx="710" cy="318" r="16" fill="#6f7c68"/>
    <circle cx="710" cy="318" r="7" fill="#f8faf7"/>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="90" y="400" width="278" height="56" rx="28" fill="#ffffff" stroke="#b5c7c1" stroke-width="3"/>
    <rect x="70" y="448" width="318" height="38" rx="18" fill="#b69467"/>
    <path d="M92 486 H368 L346 536 H114 Z" fill="#9f8059"/>
  </g>

  <g transform="translate(128 360)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="134" height="62" rx="20" fill="#fbf7ec" stroke="#c4b07e" stroke-width="3"/>
    <g transform="translate(27 20)" fill="none" stroke="#66512f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13" cy="13" r="13"/>
      <path d="M26 13 H78"/>
      <path d="M58 13 V28"/>
      <path d="M73 13 V24"/>
    </g>
  </g>

  <g transform="translate(274 338)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="124" height="88" rx="22" fill="#f8fbff" stroke="#9db4c8" stroke-width="4"/>
    <text x="62" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#41586b">BACKUP</text>
    <path d="M39 58 H84" stroke="#41586b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="34" cy="58" r="9" fill="#ffffff" stroke="#41586b" stroke-width="5"/>
  </g>

  <g transform="translate(827 138)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="208" height="250" rx="26" fill="#f7fbfb" stroke="#9db7b3" stroke-width="5"/>
    <rect x="34" y="30" width="140" height="36" rx="12" fill="#dcebea" stroke="#9db7b3" stroke-width="3"/>
    <g fill="#496f6b">
      <circle cx="58" cy="102" r="11"/>
      <circle cx="104" cy="102" r="11"/>
      <circle cx="150" cy="102" r="11"/>
      <circle cx="58" cy="148" r="11"/>
      <circle cx="104" cy="148" r="11"/>
      <circle cx="150" cy="148" r="11"/>
      <circle cx="58" cy="194" r="11"/>
      <circle cx="104" cy="194" r="11"/>
      <circle cx="150" cy="194" r="11"/>
    </g>
  </g>

  <g transform="translate(812 420)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="222" height="84" rx="18" fill="#fffdf5" stroke="#c6b27f" stroke-width="4"/>
    <text x="111" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#66512f">Guest code</text>
    <g fill="#66512f">
      <circle cx="80" cy="58" r="5"/>
      <circle cx="98" cy="58" r="5"/>
      <circle cx="116" cy="58" r="5"/>
      <circle cx="134" cy="58" r="5"/>
    </g>
  </g>

  <g transform="translate(686 408)" filter="url(#smallShadow)">
    <rect x="0" y="0" width="80" height="52" rx="13" fill="#fffaf0" stroke="#b8893e" stroke-width="4"/>
    <rect x="80" y="17" width="12" height="18" rx="4" fill="#b8893e"/>
    <rect x="12" y="12" width="44" height="28" rx="7" fill="#f2c460"/>
    <path d="M62 16 V36" stroke="#b8893e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#75958e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.78">
    <path d="M396 466 C458 518 520 538 600 538 C680 538 742 516 804 466"/>
    <path d="M402 466 L436 462 L421 493"/>
    <path d="M798 466 L764 462 L779 493"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="86" y="82" fill="#2d514c" font-size="42" font-weight="700">Choose the access routine first</text>
    <text x="88" y="122" fill="#5b7470" font-size="23">Keys, codes, backup access, batteries, and privacy all belong in the same decision.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="456" y="546" width="288" height="48" rx="24" fill="#eef6f2" stroke="#a9c0b7" stroke-width="3"/>
    <text x="600" y="577" fill="#365d57" font-size="21">Convenience needs a backup plan</text>
  </g>
</svg>
